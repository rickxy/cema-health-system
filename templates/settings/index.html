{% extends 'base.html' %}
{% load static %}

{% block title %}Settings{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row">
        <div class="col-12">
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">Settings Management</h3>
                    <div class="card-tools">
                        <button type="button" class="btn btn-primary" data-toggle="modal" data-target="#add-setting-modal">
                            <i class="fas fa-plus"></i> Add Setting
                        </button>
                    </div>
                </div>
                <div class="card-body">
                    <table id="settings-table" class="table table-bordered table-striped">
                        <thead>
                            <tr>
                                <th>Key</th>
                                <th>Value</th>
                                <th>Description</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Add Setting Modal -->
<div class="modal fade" id="add-setting-modal">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title">Add New Setting</h4>
                <button type="button" class="close" data-dismiss="modal">&times;</button>
            </div>
            <form id="add-setting-form">
                <div class="modal-body">
                    <div class="form-group">
                        <label for="setting-key">Key</label>
                        <input type="text" class="form-control" id="setting-key" required>
                    </div>
                    <div class="form-group">
                        <label for="setting-value">Value</label>
                        <textarea class="form-control" id="setting-value" required></textarea>
                    </div>
                    <div class="form-group">
                        <label for="setting-description">Description</label>
                        <textarea class="form-control" id="setting-description"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Edit Setting Modal -->
<div class="modal fade" id="edit-setting-modal">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title">Edit Setting</h4>
                <button type="button" class="close" data-dismiss="modal">&times;</button>
            </div>
            <form id="edit-setting-form">
                <div class="modal-body">
                    <input type="hidden" id="edit-setting-id">
                    <div class="form-group">
                        <label for="edit-setting-key">Key</label>
                        <input type="text" class="form-control" id="edit-setting-key" required>
                    </div>
                    <div class="form-group">
                        <label for="edit-setting-value">Value</label>
                        <textarea class="form-control" id="edit-setting-value" required></textarea>
                    </div>
                    <div class="form-group">
                        <label for="edit-setting-description">Description</label>
                        <textarea class="form-control" id="edit-setting-description"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                    <button type="submit" class="btn btn-primary">Update</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{% static 'js/settings.js' %}"></script>
{% endblock %}
